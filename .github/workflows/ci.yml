name: Verify GridSense
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gridsense
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: gridsense
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U gridsense" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
          python-version: "3.12"
      - run: uv sync --locked --extra dev
      - run: uv run ruff check backend tests scripts
      - run: uv run ruff format --check backend tests scripts
      - run: uv run pytest -q
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://gridsense:ci-only-password@localhost:5432/gridsense
      - run: uv run python scripts/verify_catalog.py
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
          python-version: "3.12"
      - run: uv sync --locked --extra dev
        working-directory: .
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
          python-version: "3.12"
      - run: docker compose --profile mqtt up --build --detach --wait --wait-timeout 120
      - run: |
          curl --fail http://127.0.0.1:8000/api/health
          curl --fail http://127.0.0.1:8000/api/sites/1/overview
          curl --fail http://127.0.0.1:8000/
      - run: uv run python scripts/verify_mqtt.py
      - if: always()
        run: docker compose --profile mqtt logs --no-color
      - if: always()
        run: docker compose --profile mqtt down --volumes
